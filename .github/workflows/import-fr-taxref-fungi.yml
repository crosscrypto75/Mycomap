name: Import French TAXREF fungal checklist
on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 2 2 *'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and filter TAXREF
        run: python scripts/import_fr_taxref_fungi.py
      - name: Commit taxonomy checklist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mycology/france-taxref-fungi.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh French fungal TAXREF checklist"
            git push
          fi
