name: Build French fungal occurrence reference
on:
  workflow_dispatch:
  schedule:
    - cron: '25 4 1 * *'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build GBIF reference
        run: python scripts/build_fr_fungi_reference.py
      - name: Commit refreshed reference
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mycology/france-gbif.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh GBIF French fungal occurrence reference"
            git push
          fi
