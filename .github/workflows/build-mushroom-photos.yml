name: Construire photothèque MycoMap
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-mushroom-photos.yml'
      - 'scripts/download_mushroom_photos.py'
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger les photos sous licence ouverte
        run: python3 scripts/download_mushroom_photos.py
      - name: Vérifier le manifeste
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('assets/champignons/credits.json').read_text())
          n=sum(len(v) for v in d.values())
          print('Photos téléchargées :',n)
          if n<1: raise SystemExit('Aucune image téléchargée : publication annulée')
          PY
      - name: Enregistrer images et crédits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/champignons/
          git diff --cached --quiet || (git commit -m 'Ajouter photographies mycologiques libres et crédits' && git push)
