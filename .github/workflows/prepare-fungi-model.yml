name: Prepare local fungi model assets
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download pretrained model and labels
        run: python scripts/download_fungi_model.py
      - name: Check TFLite magic and metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('models/fungi/fungi_int8.tflite')
          b=p.read_bytes()
          assert len(b)>100000, 'Model file too small'
          assert b[4:8]==b'TFL3', 'Not a TFLite flatbuffer'
          print('TFLite model verified:',len(b),'bytes')
          for name in ('labels.txt','classes.json'):
              f=Path('models/fungi')/name
              assert f.stat().st_size>0
              print(name,f.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mycomap-fungi-model
          path: models/fungi/
          retention-days: 14
      - name: Publish verified model to repository for GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/fungi/
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified local fungi model assets"
            git push origin HEAD:main
          fi
