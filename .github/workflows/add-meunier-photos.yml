name: Compléter photos du meunier
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-meunier-photos.yml'
      - 'scripts/add_meunier_photos.py'
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/add_meunier_photos.py
      - name: Commit images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/champignons/meunier/meunier_05.jpg assets/champignons/meunier/meunier_06.jpg
          git diff --cached --quiet || (git commit -m 'Ajouter deux photos réelles du meunier' && git push)
